<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="stylesheet" href="assets/access-gate.css" />
<script src="assets/access-gate.js?v=20260716a"></script>
<title>QIMA 小程序 - 通知</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --carbon: #191919;
    --seal: #737373;
    --pool-500: #4169e1;
    --pool-100: #e6ecfb;
    --pool-050: #f2f5fd;
    --border: #dedede;
    --page-bg: #f8f9fb;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Inter, sans-serif;
    background: #c9ced8;
    color: var(--carbon);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; }

  .phone {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--page-bg);
    overflow: hidden;
  }

  /* 顶部白色导航区 */
  .header { background: #fff; flex-shrink: 0; }
  .statusbar {
    height: 47px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 27px 0 0;
  }
  .statusbar .time { width: 134px; text-align: center; font-weight: 600; font-size: 17px; letter-spacing: -.4px; padding-top: 4px; }
  .statusbar .indicators { display: flex; align-items: center; gap: 7px; padding-top: 4px; }
  .statusbar .indicators img { display: block; }

  .navbar {
    position: relative;
    height: 41px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 17px;
  }
  .navbar .back { width: 12px; height: 20px; display: block; }
  .navbar .logo {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 72px; height: 16px;
  }
  .nav-capsule {
    width: 83px; height: 30px; border-radius: 15px;
    background: rgba(255,255,255,.7); border: .5px solid var(--border);
    display: flex; align-items: center; justify-content: space-around; position: relative;
  }
  .nav-capsule img { width: 17px; height: 17px; }
  .nav-capsule .divider { width: 1px; height: 18px; background: #d2d2d2; }

  /* 标题栏 */
  .page-head {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 6px;
  }
  .page-title { font-size: 20px; font-weight: 600; letter-spacing: -.3px; color: var(--carbon); }
  .page-title .unread {
    display: inline-block; vertical-align: 3px; margin-left: 8px;
    min-width: 20px; height: 18px; padding: 0 6px;
    border-radius: 9px; background: #e5353d;
    font-size: 11px; font-weight: 600; line-height: 18px; color: #fff; text-align: center;
  }
  .mark-read {
    background: none; border: 0; padding: 4px 0;
    font-family: inherit; font-size: 12px; color: var(--pool-500); cursor: pointer;
  }
  .mark-read[disabled] { color: #b9bfca; cursor: default; }

  /* 内容区 */
  .content {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 12px;
    padding: 6px 16px 12px;
    overflow-y: auto;
  }
  .content::-webkit-scrollbar { display: none; }

  .group { flex-shrink: 0; }
  .group-label {
    padding: 0 4px 6px;
    font-size: 12px; color: var(--seal);
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(25,25,25,.08);
    overflow: hidden;
  }

  /* 通知行 */
  .notif-row {
    width: 100%;
    display: flex; align-items: flex-start; gap: 10px;
    padding: 14px 16px;
    border-bottom: .5px solid var(--border);
    background: none; border-left: 0; border-right: 0; border-top: 0;
    font-family: inherit; text-align: left; cursor: pointer;
  }
  .notif-row:last-child { border-bottom: 0; }
  .notif-row:active { background: #f5f6f9; }
  .notif-icon {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .notif-icon.blue { background: var(--pool-100); }
  .notif-icon.green { background: #eaf6f2; }
  .notif-icon.orange { background: #fef0ee; }
  .notif-icon img { width: 16px; height: 16px; display: block; }
  .notif-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .notif-title {
    position: relative; padding-right: 14px;
    font-size: 14px; line-height: 21px; color: var(--carbon);
  }
  .notif-row.unread .notif-title { font-weight: 600; }
  .notif-title .dot {
    position: absolute; right: 0; top: 8px;
    width: 6px; height: 6px; border-radius: 3px; background: #e5353d;
  }
  .notif-sub {
    font-size: 12px; line-height: 18px; color: var(--seal);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .notif-time { font-size: 11px; line-height: 16.5px; color: var(--seal); }

  .empty {
    padding: 60px 0; text-align: center;
    font-size: 13px; color: var(--seal);
  }

  .toast {
    position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    z-index: 70; max-width: 260px;
    padding: 10px 16px; border-radius: 10px;
    background: rgba(25,25,25,.86); color: #fff;
    font-size: 13px; line-height: 18px; text-align: center;
    opacity: 0; visibility: hidden; transition: opacity .2s ease;
  }
  .toast.show { opacity: 1; visibility: visible; }

  /* Tab Bar：五个入口平级 */
  .tabbar {
    position: relative; z-index: 3;
    width: 100%; height: 71.5px; flex-shrink: 0;
    background: #fff; border-radius: 12px 12px 0 0;
    box-shadow: 0 -1px 6px rgba(0,0,0,.06);
    display: flex; align-items: flex-start;
  }
  .tab {
    flex: 1; height: 71px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 10px 0 20px; text-decoration: none;
    position: relative;
  }
  .tab img { width: 22px; height: 22px; }
  .tab .label { font-size: 10px; letter-spacing: .1px; color: var(--seal); }
  .tab.active .label { color: var(--pool-500); font-weight: 600; }
</style>
<link rel="stylesheet" href="assets/phone-shell.css" />
<link rel="stylesheet" href="assets/lang-toggle.css" />
<link rel="stylesheet" href="assets/i18n-en.css" />
<link rel="stylesheet" href="assets/demo-shortcuts.css?v=20260803e" />
<script>window.PAGE_TITLE_KEY = 'title.notifications';</script>
<script src="assets/i18n/zh.js?v=20260803h"></script>
<script src="assets/i18n/en.js?v=20260803h"></script>
<script src="assets/i18n-runtime.js"></script>
<script src="assets/demo-shortcuts.js?v=20260803e"></script>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="statusbar">
        <div class="time">9:41</div>
        <div class="indicators">
          <img src="assets/signal.svg" alt="" width="18" height="12" />
          <img src="assets/wifi.svg" alt="" width="17" height="12" />
          <img src="assets/battery.svg" alt="" width="27" height="13" />
        </div>
      </div>
      <div class="navbar">
        <a href="index.html"><img class="back" src="assets/vector52.svg" alt="返回" data-i18n-alt="common.back" /></a>
        <img class="logo" src="assets/frame207.svg" alt="QIMA" />
        <div class="nav-capsule">
          <img src="assets/share.svg" alt="" />
          <div class="divider"></div>
          <img src="assets/home.svg" alt="" />
        </div>
      </div>
    </div>

    <div class="page-head">
      <div class="page-title">
        <span data-i18n="notifications.title">通知</span><span class="unread" id="unreadBadge">2</span>
      </div>
      <button class="mark-read" type="button" id="markAllBtn" onclick="markAllRead()" data-i18n="notifications.markAllRead">全部标为已读</button>
    </div>

    <div class="content" id="notifContent"></div>

    <!-- 底部 Tab Bar -->
    <div class="tabbar">
      <a class="tab" href="index.html">
        <img src="assets/tab_home.svg" alt="" />
        <span class="label" data-i18n="common.tab.home">首页</span>
      </a>
      <a class="tab" href="orders.html">
        <img src="assets/tab_order.svg" alt="" />
        <span class="label" data-i18n="common.tab.orders">订单</span>
      </a>
      <a class="tab active" href="notifications.html">
        <img src="assets/tab_notify_active.svg" alt="" />
        <span class="label" data-i18n="common.tab.notify">通知</span>
      </a>
      <a class="tab" href="reports.html">
        <img src="assets/tab_report.svg" alt="" />
        <span class="label" data-i18n="common.tab.reports">报告</span>
      </a>
      <a class="tab" href="me.html">
        <img src="assets/tab_me.svg" alt="" />
        <span class="label" data-i18n="common.tab.me">我的</span>
      </a>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    function t(key, vars){ return (window.I18n && I18n.t) ? I18n.t(key, vars) : key; }
    function escapeHtml(str){ return window.I18n ? I18n.escapeHtml(str) : String(str == null ? '' : str); }

    /** Demo inbox. `group` buckets rows under a date heading. */
    const NOTIFICATIONS = [
      {
        id: 'n1', group: 'today', tone: 'green', icon: 'assets/notif_check.svg', unread: true,
        titleKey: 'notifications.reportReadyTitle', subKey: 'notifications.reportReadySub',
        timeKey: 'notifications.timeTodayEvening', href: 'reports.html'
      },
      {
        id: 'n2', group: 'today', tone: 'blue', icon: 'assets/notif_doc.svg', unread: true,
        titleKey: 'notifications.orderPlacedTitle', subKey: 'notifications.orderPlacedSub',
        timeKey: 'notifications.timeTodayAfternoon', href: 'orders.html'
      },
      {
        id: 'n3', group: 'earlier', tone: 'orange', icon: 'assets/notif_doc.svg', unread: false,
        titleKey: 'notifications.sampleReminderTitle', subKey: 'notifications.sampleReminderSub',
        timeKey: 'notifications.timeSunday', href: 'orders.html'
      },
      {
        id: 'n4', group: 'earlier', tone: 'blue', icon: 'assets/notif_icon.svg', unread: false,
        titleKey: 'notifications.orderConfirmedTitle', subKey: 'notifications.orderConfirmedSub',
        timeKey: 'notifications.timeFriday', href: 'orders.html'
      }
    ];

    const GROUP_LABELS = { today: 'notifications.groupToday', earlier: 'notifications.groupEarlier' };

    function unreadCount(){
      return NOTIFICATIONS.filter(function(n){ return n.unread; }).length;
    }

    function notifRowHtml(n){
      return '<button class="notif-row' + (n.unread ? ' unread' : '') + '" type="button" ' +
          'data-id="' + n.id + '" onclick="openNotification(\'' + n.id + '\')">' +
          '<span class="notif-icon ' + n.tone + '"><img src="' + n.icon + '" alt="" /></span>' +
          '<span class="notif-body">' +
            '<span class="notif-title">' + escapeHtml(t(n.titleKey)) +
              (n.unread ? '<span class="dot"></span>' : '') +
            '</span>' +
            '<span class="notif-sub">' + escapeHtml(t(n.subKey)) + '</span>' +
            '<span class="notif-time">' + escapeHtml(t(n.timeKey)) + '</span>' +
          '</span>' +
        '</button>';
    }

    function renderNotifications(){
      const wrap = document.getElementById('notifContent');
      if(!NOTIFICATIONS.length){
        wrap.innerHTML = '<div class="empty">' + escapeHtml(t('notifications.empty')) + '</div>';
      } else {
        const groups = ['today', 'earlier'];
        wrap.innerHTML = groups.map(function(group){
          const rows = NOTIFICATIONS.filter(function(n){ return n.group === group; });
          if(!rows.length) return '';
          return '<div class="group">' +
              '<div class="group-label">' + escapeHtml(t(GROUP_LABELS[group])) + '</div>' +
              '<div class="card">' + rows.map(notifRowHtml).join('') + '</div>' +
            '</div>';
        }).join('');
      }
      renderUnread();
    }

    function renderUnread(){
      const count = unreadCount();
      const badge = document.getElementById('unreadBadge');
      const markBtn = document.getElementById('markAllBtn');
      badge.textContent = count;
      badge.style.display = count ? '' : 'none';
      markBtn.disabled = !count;
      markBtn.textContent = t('notifications.markAllRead');
    }

    function openNotification(id){
      const item = NOTIFICATIONS.find(function(n){ return n.id === id; });
      if(!item) return;
      item.unread = false;
      renderNotifications();
      if(item.href) location.href = item.href;
    }

    function markAllRead(){
      if(!unreadCount()) return;
      NOTIFICATIONS.forEach(function(n){ n.unread = false; });
      renderNotifications();
      showToast(t('notifications.allRead'));
    }

    function showToast(message){
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(function(){ el.classList.remove('show'); }, 1600);
    }

    if (window.I18n) {
      I18n.initLangToggle({ onLangApplied: renderNotifications });
    }
    renderNotifications();
  </script>
</body>
</html>
