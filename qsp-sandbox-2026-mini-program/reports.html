<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>QIMA 小程序 - 报告中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* colors: assets/qima-tokens.css */
  html, body {
    font-family: var(--font-sans);
    background: var(--phone-frame);
    color: var(--carbon);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; }

  .phone {
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--pool-050) 0%, var(--cloud) 100%);
    overflow: hidden;
  }
  .blob { position: absolute; border-radius: 68px; filter: blur(50px); pointer-events: none; z-index: 0; }
  .blob-1 { width: 340px; height: 314px; background: var(--orange-500); opacity: .07; left: 230px; top: -130px; transform: rotate(30deg); }
  .blob-2 { width: 139px; height: 128px; background: var(--peach); opacity: .08; left: 300px; top: 20px; transform: rotate(30deg); }
  .blob-3 { width: 129px; height: 119px; background: var(--pool-500); opacity: .12; left: -70px; top: 0; transform: rotate(-30deg); }
  .blob-4 { width: 129px; height: 119px; background: var(--peach); opacity: .12; left: -120px; top: 0; transform: rotate(-30deg); }

  /* 状态栏 */
  .statusbar {
    position: relative; z-index: 2;
    height: 47px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 27px 0 0;
  }
  .statusbar .time { width: 134px; text-align: center; font-weight: 600; font-size: 17px; letter-spacing: -.4px; padding-top: 4px; }
  .statusbar .indicators { display: flex; align-items: center; gap: 7px; padding-top: 4px; }
  .statusbar .indicators img { display: block; }

  /* 导航栏 */
  .navbar {
    position: relative; z-index: 2;
    height: 44px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 17px;
  }
  .navbar .back { width: 12px; height: 20px; }
  .navbar .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 600; letter-spacing: -.34px; color: var(--carbon);
  }
  .nav-capsule {
    width: 83px; height: 30px; border-radius: 15px;
    background: rgba(255,255,255,.7); border: .5px solid var(--border);
    display: flex; align-items: center; justify-content: space-around; position: relative;
  }
  .nav-capsule img { width: 17px; height: 17px; }
  .nav-capsule .divider { width: 1px; height: 18px; background: var(--line); }

  /* Hero 统计卡 — Figma 15976:21232 */
  .hero {
    position: relative; z-index: 2;
    margin: 8px 16px 4px;
    min-height: 102px;
    background: var(--pool-050);
    border: .667px solid #d3dcf8;
    border-radius: 16px;
    padding: 8px 14px 8px 18px;
    display: flex; align-items: center; justify-content: space-between;
    overflow: hidden;
    gap: 12px;
  }
  .hero-text { position: relative; z-index: 1; min-width: 0; }
  .hero-num-row {
    display: flex; align-items: baseline; gap: 6px;
    line-height: 1;
  }
  .hero-num {
    font-size: 34px; font-weight: 700; color: var(--pool-500);
    line-height: 34px; letter-spacing: -.11px;
  }
  .hero-num-row .unit {
    font-size: 15px; font-weight: 600; color: var(--seal);
    letter-spacing: -.73px; line-height: 15px;
  }
  .hero-label {
    margin-top: 6px; font-size: 12px; line-height: 1.2; color: var(--seal);
  }
  .hero-art {
    flex-shrink: 0;
    width: 98px; height: 98px;
    line-height: 0;
    filter: drop-shadow(0 4px 2px rgba(0, 0, 0, .25));
  }
  .hero-art img {
    display: block; width: 98px; height: 98px;
    object-fit: contain;
  }

  /* 业务线下拉 + 搜索（对齐订单页 filter 行） */
  .cat-tabs {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 8px;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .biz-chip {
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    height: 36px; max-width: 118px; padding: 0 10px; border-radius: 8px;
    background: var(--white); border: 1px solid var(--line);
    font: inherit; font-size: 12px; color: var(--carbon); white-space: nowrap;
    cursor: pointer;
  }
  .biz-chip:active { background: var(--mist); }
  .biz-chip.open {
    border-color: var(--pool-100);
    background: var(--pool-050);
    color: var(--pool-500);
  }
  .biz-chip .chip-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .biz-chip .caret {
    color: var(--seal); flex-shrink: 0;
    transition: transform .18s ease;
  }
  .biz-chip.open .caret { color: var(--pool-500); transform: rotate(180deg); }
  .cat-search {
    flex: 1; min-width: 0; height: 36px; border-radius: 8px;
    background: var(--white); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
  }
  .cat-search svg { color: var(--smoke); flex-shrink: 0; }
  .cat-search input {
    border: none; outline: none; background: transparent; width: 100%;
    font-size: 13px; color: var(--carbon);
  }
  .cat-search input::placeholder { color: var(--smoke); }
  .cat-filter {
    flex-shrink: 0;
    width: 36px; height: 36px; border-radius: 8px; padding: 0;
    background: var(--pool-050); border: 1px solid var(--pool-100); color: var(--pool-500);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cat-filter:active { background: var(--pool-100); }

  .biz-mask {
    position: absolute; inset: 0; z-index: 80;
    background: rgba(25,25,25,.42);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .2s ease;
  }
  .biz-mask.show { opacity: 1; visibility: visible; }
  .biz-sheet {
    width: 100%;
    background: var(--white);
    border-radius: 16px 16px 0 0;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateY(18px); transition: transform .22s ease;
  }
  .biz-mask.show .biz-sheet { transform: translateY(0); }
  .biz-grabber {
    width: 36px; height: 4px; border-radius: 2px; background: var(--line);
    margin: 0 auto 12px;
  }
  .biz-sheet-title {
    font-size: 16px; font-weight: 700; color: var(--carbon); margin-bottom: 10px;
  }
  .biz-opt {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 13px 4px; border: none; background: transparent;
    font: inherit; text-align: left; cursor: pointer;
    border-bottom: 1px solid var(--mist);
  }
  .biz-opt:last-of-type { border-bottom: none; }
  .biz-opt:active { background: var(--mist); }
  .biz-opt-body { flex: 1; min-width: 0; }
  .biz-opt-name {
    font-size: 14.5px; font-weight: 600; color: var(--carbon); line-height: 20px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .biz-opt-badge {
    font-size: 10px; font-weight: 500; line-height: 16px;
    padding: 1px 6px; border-radius: 4px;
    color: var(--lemon-900); background: var(--lemon-200);
  }
  .biz-opt.is-disabled { cursor: default; opacity: .72; }
  .biz-opt.is-disabled .biz-opt-name { color: var(--smoke); font-weight: 500; }
  .biz-opt.is-disabled:active { background: transparent; }
  .biz-opt.is-disabled .biz-check { display: none; }
  .biz-opt.selected .biz-opt-name { color: var(--pool-500); }
  .biz-check {
    width: 18px; height: 18px; flex-shrink: 0; color: var(--pool-500); opacity: 0;
  }
  .biz-opt.selected .biz-check { opacity: 1; }
  .biz-cancel {
    margin-top: 6px; height: 44px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--mist);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--seal);
    cursor: pointer; width: 100%;
  }
  .toast {
    position: absolute; left: 50%; bottom: 92px; z-index: 90;
    transform: translateX(-50%) translateY(8px);
    max-width: calc(100% - 48px);
    padding: 10px 14px; border-radius: 10px;
    background: rgba(25,25,25,.88); color: var(--white);
    font-size: 13px; line-height: 18px; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  /* 报告列表 */
  .list {
    position: relative; z-index: 1; flex: 1; overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .list::-webkit-scrollbar { display: none; }
  .rlist-card {
    position: relative; display: block; overflow: hidden;
    flex-shrink: 0; /* keep full card height; list scrolls instead of crushing rows */
    background:
      linear-gradient(135deg, var(--accent-wash), rgba(255,255,255,0) 46%),
      var(--white);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 1px 2px rgba(25,25,25,.04), 0 8px 20px rgba(25,25,25,.06);
    padding: 13px 14px 11px 17px;
    color: inherit; text-decoration: none; cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .rlist-card:active {
    transform: scale(.994);
    box-shadow: 0 1px 2px rgba(25,25,25,.05), 0 4px 10px rgba(25,25,25,.05);
  }
  /* One accent per overall-result family (myQIMA Overall result). */
  .rlist-card.pass    { --accent: var(--kiwi);      --accent-wash: rgba(0,168,118,.08); --accent-soft: var(--kiwi-100); --accent-line: var(--kiwi-100); }
  .rlist-card.fail    { --accent: var(--cherry);  --accent-wash: rgba(229,53,61,.08);   --accent-soft: var(--cherry-100); --accent-line: var(--cherry-100); }
  .rlist-card.pending { --accent: var(--lemon-900);          --accent-wash: rgba(189,138,0,.10); --accent-soft: var(--lemon-200); --accent-line: var(--lemon-200); }
  .rlist-card.neutral { --accent: var(--seal);               --accent-wash: rgba(107,114,128,.08); --accent-soft: var(--mist); --accent-line: var(--line); }
  .rlist-card.fail-accepted { --accent: var(--cherry); --accent-wash: rgba(229,53,61,.06); --accent-soft: #FDEFEF; --accent-line: var(--cherry-100); }
  .rlist-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--accent);
  }
  .rlist-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .rlist-title { min-width: 0; }
  .rlist-name {
    font-size: 15px; font-weight: 700; color: var(--carbon); line-height: 20px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rlist-status {
    flex-shrink: 0; max-width: 46%; font-size: 10.5px; height: 22px; line-height: 20px; padding: 0 8px;
    border-radius: 999px; font-weight: 700; letter-spacing: .1px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rlist-sku {
    margin-top: 2px; font-size: 11.5px; line-height: 15px; color: var(--seal);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rlist-meta {
    display: flex; align-items: center; gap: 5px; min-width: 0;
    margin-top: 8px; color: var(--seal); font-size: 11px; line-height: 15px;
  }
  .rlist-meta svg { color: var(--smoke); flex-shrink: 0; width: 12px; height: 12px; }
  .rlist-meta .report-no {
    min-width: 0; color: var(--seal); font-weight: 600; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rlist-meta .rlist-date { flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .rlist-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--smoke); flex-shrink: 0; }
  .rlist-supplier-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 9px;
  }
  .rlist-supplier {
    display: inline-flex; align-items: center; gap: 6px; min-width: 0;
    font-size: 12px; line-height: 16px; color: var(--carbon); font-weight: 600;
  }
  .rlist-supplier svg { width: 13px; height: 13px; color: var(--smoke); flex-shrink: 0; }
  .rlist-supplier span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 24px 48px;
    text-align: center;
    gap: 8px;
  }
  .list-empty-art {
    width: 160px;
    height: 160px;
    margin: 0 0 8px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .list-empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--carbon);
    line-height: 22px;
  }
  .list-empty-sub {
    font-size: 12.5px;
    line-height: 18px;
    color: var(--seal);
    max-width: 260px;
  }
  .rlist-bottom {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
  }
  .rlist-preview {
    color: var(--pool-500); font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .rlist-preview svg { width: 13px; height: 13px; }
  .rlist-chev { width: 24px; height: 24px; border-radius: 50%; background: var(--pool-050); color: var(--pool-500); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rlist-chev svg { width: 13px; height: 13px; }
  .rlist-card:active .rlist-chev { background: var(--pool-100); }

  /* 旧版文件夹网格：先隐藏保留代码 */
  .grid.folder-grid-legacy {
    display: none !important;
  }

  /* 报告网格（旧） */
  .grid {
    position: relative; z-index: 1; flex: 1; overflow-y: auto;
    padding: 12px 16px 20px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    align-content: start;
  }
  .grid::-webkit-scrollbar { display: none; }

  /* 文件夹式报告卡（拟物） */
  .rcard {
    position: relative;
    display: block;
    min-height: 176px;
    text-decoration: none;
    color: var(--white);
    cursor: pointer;
    filter: drop-shadow(0 10px 18px rgba(25,25,25,.16));
    transition: transform .12s ease;
  }
  .rcard:active { transform: translateY(1px) scale(.994); }
  .rcard.c-blue   { --c1:var(--pool-500); --c2:var(--pool-500); --cback:var(--pool-900); --ctab:var(--pool-500); }
  .rcard.c-purple { --c1:var(--pool-100); --c2:var(--pool-900); --cback:var(--pool-900); --ctab:var(--pool-500); }
  .rcard.c-teal   { --c1:var(--kiwi); --c2:var(--kiwi); --cback:var(--kiwi); --ctab:var(--kiwi); }
  .rcard.c-orange { --c1:var(--peach); --c2:var(--orange-500); --cback:var(--orange-500); --ctab:var(--orange-500); }

  /* 文件夹后板 + 顶部标签页 */
  .rcard .folder-back {
    position: absolute; inset: 0; top: 12px;
    border-radius: 10px 14px 14px 14px;
    background: var(--cback);
  }
  .rcard .folder-back::before {
    content: ""; position: absolute; top: -11px; left: 0;
    width: 96px; height: 16px;
    background: var(--ctab);
    border-radius: 8px 12px 0 0;
  }
  .rcard .folder-back::after {
    content: ""; position: absolute; top: -11px; left: 90px;
    width: 22px; height: 16px;
    background: var(--ctab);
    transform: skewX(32deg);
    border-radius: 0 6px 0 0;
  }

  /* 露出的纸张 */
  .rcard .papers { position: absolute; left: 12px; right: 12px; top: 20px; height: 52px; }
  .rcard .papers i {
    position: absolute; left: 0; right: 0; top: 0; height: 52px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,.12);
  }
  .rcard .papers i:nth-child(1) { background: var(--mist); transform: rotate(-3.5deg); right: 10px; }
  .rcard .papers i:nth-child(2) { background: var(--mist); transform: rotate(2.5deg); left: 8px; }
  .rcard .papers i:nth-child(3) {
    background:
      repeating-linear-gradient(var(--white) 0 6px, var(--line) 6px 7px) top/100% 100%;
    background-color: var(--white);
  }

  /* 文件夹前袋 */
  .rcard .pocket {
    position: absolute; left: 0; right: 0; bottom: 0; top: 46px;
    border-radius: 3px 3px 14px 14px;
    padding: 14px 14px 14px;
    background: linear-gradient(158deg, var(--c1) 0%, var(--c2) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      0 -5px 10px rgba(0,0,0,.14);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* 前袋开口处高光 + 内阴影，营造纸插入袋子的感觉 */
  .rcard .pocket::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
    pointer-events: none;
  }
  /* 前袋右下角折角高光 */
  .rcard .pocket::after {
    content: ""; position: absolute; right: -30px; bottom: -30px;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,0) 70%);
    pointer-events: none;
  }

  .rcard .tag {
    align-self: flex-start;
    background: rgba(255,255,255,.26);
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 6px; padding: 2px 8px;
    font-size: 10px; font-weight: 700; letter-spacing: .6px;
    margin-bottom: 12px;
    backdrop-filter: blur(2px);
  }
  .rcard .rname { font-size: 15px; font-weight: 700; line-height: 1.3; text-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .rcard .rsku { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.9); }
  .rcard .rstatus {
    margin-top: auto; padding-top: 12px;
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 700;
  }
  .rcard .rstatus .dot {
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .rcard .rstatus.pass .dot { color: var(--kiwi); }
  .rcard .rstatus.fail .dot { color: var(--cherry); }
  .rcard .rstatus.pending .dot { color: var(--lemon-900); }
  .rcard .rstatus .dot svg { width: 10px; height: 10px; }

</style>

<body>
  <div class="phone">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>

    <!-- 状态栏 -->
    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="indicators">
        <img src="assets/signal.svg" alt="" width="18" height="12" />
        <img src="assets/wifi.svg" alt="" width="17" height="12" />
        <img src="assets/battery.svg" alt="" width="27" height="13" />
      </div>
    </div>

    <!-- 导航栏 -->
    <div class="navbar">
      <a href="index.html"><img class="back" src="assets/vector52.svg" alt="返回" data-i18n-alt="common.back" /></a>
      <div class="title" data-i18n="reports.title">报告中心</div>
      <div class="nav-capsule">
        <img src="assets/share.svg" alt="" />
        <div class="divider"></div>
        <img src="assets/home.svg" alt="" />
      </div>
    </div>

    <!-- Hero 统计 — Figma 15976:21232 -->
    <div class="hero">
      <div class="hero-text">
        <div class="hero-num-row">
          <span class="hero-num">128</span>
          <span class="unit" data-i18n="reports.statUnit">Reports</span>
        </div>
        <div class="hero-label" data-i18n="reports.statLabel">全部报告</div>
      </div>
      <div class="hero-art"><img src="assets/reports-hero-clipboard.png?v=20260805g" width="98" height="98" alt="" /></div>
    </div>

    <!-- Business line + search + filter (aligned with orders filter row) -->
    <div class="cat-tabs" id="catTabs">
      <button type="button" class="biz-chip" id="bizChip" aria-haspopup="listbox" aria-expanded="false">
        <span class="chip-label" id="bizChipLabel" data-i18n="index.serviceLab">实验室检测</span>
        <svg class="caret" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="cat-search">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="reportSearch" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search reports / SKU / product name" data-i18n-placeholder="reports.searchPlaceholder" />
      </div>
      <button type="button" class="cat-filter" id="reportFilterBtn" aria-label="Filter" title="Filter" data-i18n-title="common.filter">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M4.5 8h7M6.5 13h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- 报告列表（新） -->
    <div class="list" id="reportList"></div>

    <!-- 旧版文件夹网格：先隐藏保留 -->
    <div class="grid folder-grid-legacy" id="reportGrid" hidden aria-hidden="true"></div>

    <!-- 底部 Tab Bar -->
    <div class="tabbar">
      <a class="tab" href="index.html">
        <img src="assets/tab_home.svg" alt="" />
        <span class="label" data-i18n="common.tab.home">首页</span>
      </a>
      <a class="tab" href="orders.html">
        <img src="assets/tab_order.svg" alt="" />
        <span class="label" data-i18n="common.tab.orders">订单</span>
      </a>
      <a class="tab" href="notifications.html">
        <img src="assets/tab_notify.svg" alt="" />
        <span class="label" data-i18n="common.tab.notify">通知</span>
        <span class="tab-badge">2</span>
      </a>
      <a class="tab active" href="reports.html" aria-current="page">
        <img src="assets/tab_report_active.svg" alt="" />
        <span class="label" data-i18n="common.tab.reports">报告</span>
      </a>
      <a class="tab" href="me.html">
        <img src="assets/tab_me.svg" alt="" />
        <span class="label" data-i18n="common.tab.me">我的</span>
      </a>
    </div>

    <div class="biz-mask" id="bizMask" onclick="closeBizSheet(event)" aria-hidden="true">
      <div class="biz-sheet" role="listbox" aria-labelledby="bizSheetTitle" onclick="event.stopPropagation()">
        <div class="biz-grabber" aria-hidden="true"></div>
        <div class="biz-sheet-title" id="bizSheetTitle" data-i18n="orders.bizSheetTitle">选择业务线</div>
        <button type="button" class="biz-opt" role="option" aria-selected="false" data-biz="all" onclick="selectBizLine('all')">
          <div class="biz-opt-body">
            <div class="biz-opt-name" data-i18n="orders.chipAll">全部</div>
          </div>
          <svg class="biz-check" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 9.2l3.4 3.4 7.6-7.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="biz-opt selected" role="option" aria-selected="true" data-biz="lab" onclick="selectBizLine('lab')">
          <div class="biz-opt-body">
            <div class="biz-opt-name" data-i18n="index.serviceLab">实验室检测</div>
          </div>
          <svg class="biz-check" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 9.2l3.4 3.4 7.6-7.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="biz-opt" role="option" aria-selected="false" data-biz="inspection" onclick="selectBizLine('inspection')">
          <div class="biz-opt-body">
            <div class="biz-opt-name" data-i18n="index.serviceInspection">产品检验</div>
          </div>
          <svg class="biz-check" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 9.2l3.4 3.4 7.6-7.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="biz-opt is-disabled" role="option" aria-selected="false" aria-disabled="true" data-biz="audit" onclick="selectBizLine('audit')">
          <div class="biz-opt-body">
            <div class="biz-opt-name">
              <span data-i18n="index.serviceAudit">供应商审核</span>
              <span class="biz-opt-badge" data-i18n="orders.bizInDev">开发中</span>
            </div>
          </div>
        </button>
        <button type="button" class="biz-opt is-disabled" role="option" aria-selected="false" aria-disabled="true" data-biz="cert" onclick="selectBizLine('cert')">
          <div class="biz-opt-body">
            <div class="biz-opt-name">
              <span data-i18n="index.serviceCert">认证服务</span>
              <span class="biz-opt-badge" data-i18n="orders.bizInDev">开发中</span>
            </div>
          </div>
        </button>
        <button type="button" class="biz-cancel" onclick="closeBizSheet()" data-i18n="common.cancel">取消</button>
      </div>
    </div>
    <div class="toast" id="reportsToast" role="status" aria-live="polite"></div>
  </div>

  <script>
    const USE_FOLDER_VIEW = false; // 旧文件夹视图开关，先关闭保留代码

    const REPORTS = [
      /* Lab — myQIMA Overall result examples */
      { cat: 'lab',   color: 'c-teal',   tag: 'LAB',   nameKey: 'reports.product.toys',       sku: 'SKU-65120', status: 'pass',                 reportId: 'T-24106085-11-R1', date: '2026-06-03', supplierKey: 'reports.supplier.toys', decision: 'pending' },
      { cat: 'lab',   color: 'c-blue',   tag: 'LAB',   nameKey: 'reports.product.hardline',   sku: 'SKU-43902', status: 'pending',              reportId: 'T-24106088-11-R1', date: '2026-05-20', supplierKey: 'reports.supplier.hardline', decision: 'pending' },
      { cat: 'lab',   color: 'c-purple', tag: 'LAB',   nameKey: 'reports.product.softline',   sku: 'SKU-70418', status: 'fail',                 reportId: 'T-24106091-11-R1', date: '2026-06-01', supplierKey: 'reports.supplier.softline', decision: 'rejected' },
      { cat: 'lab',   color: 'c-orange', tag: 'LAB',   nameKey: 'reports.product.candle',     sku: 'SKU-62844', status: 'passWithInfo',         reportId: 'T-24106092-11-R1', date: '2026-05-30', supplierKey: 'reports.supplier.candle', decision: 'pending' },
      { cat: 'lab',   color: 'c-teal',   tag: 'LAB',   nameKey: 'reports.product.jewelry',    sku: 'SKU-59107', status: 'conditionalPass',      reportId: 'T-24106093-11-R1', date: '2026-05-26', supplierKey: 'reports.supplier.jewelry', decision: 'approved' },
      { cat: 'lab',   color: 'c-blue',   tag: 'LAB',   nameKey: 'reports.product.cosmetics',  sku: 'SKU-55231', status: 'failWithInfo',         reportId: 'T-24106094-11-R1', date: '2026-05-22', supplierKey: 'reports.supplier.cosmetics', decision: 'pending' },
      { cat: 'lab',   color: 'c-purple', tag: 'LAB',   nameKey: 'reports.product.furniture',  sku: 'SKU-51088', status: 'inconclusive',         reportId: 'T-24106095-11-R1', date: '2026-05-18', supplierKey: 'reports.supplier.furniture', decision: 'pending' },
      { cat: 'lab',   color: 'c-orange', tag: 'LAB',   nameKey: 'reports.product.plastics',   sku: 'SKU-48765', status: 'informationOnly',      reportId: 'T-24106096-11-R1', date: '2026-05-14', supplierKey: 'reports.supplier.plastics', decision: 'pending' },
      { cat: 'lab',   color: 'c-teal',   tag: 'LAB',   nameKey: 'reports.product.kitchen',    sku: 'SKU-46320', status: 'marginal',             reportId: 'T-24106097-11-R1', date: '2026-05-10', supplierKey: 'reports.supplier.kitchen', decision: 'pending' },
      { cat: 'lab',   color: 'c-blue',   tag: 'LAB',   nameKey: 'reports.product.food',       sku: 'SKU-38771', status: 'na',                   reportId: 'T-24106089-11-R1', date: '2026-05-08', supplierKey: 'reports.supplier.food', decision: 'pending' },
      /* Product inspection: no demo reports yet — empty state */
      /* Audit */
      { cat: 'csr',   color: 'c-purple', tag: 'CSR',   nameKey: 'reports.product.csrAudit',   sku: 'SKU-33001', status: 'conditionalPass',      reportId: 'A-24106100-11-R1', date: '2026-05-05', supplierKey: 'reports.supplier.csrAudit', decision: 'pending' }
    ];

    const ICONS = {
      pass: '<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      fail: '<svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
      pending: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.7"/><path d="M8 4.6V8l2.4 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    /** Map myQIMA overall-result keys → card accent family */
    function statusAccent(status){
      switch(status){
        case 'pass':
        case 'passWithInfo':
        case 'conditionalPass':
          return 'pass';
        case 'fail':
        case 'failWithInfo':
          return 'fail';
        case 'failAccepted':
          return 'fail-accepted';
        case 'informationOnly':
        case 'na':
          return 'neutral';
        case 'pending':
        case 'inconclusive':
        case 'inconclusiveWithInfo':
        case 'marginal':
        default:
          return 'pending';
      }
    }

    let currentBiz = 'lab';
    let searchQuery = '';

    const BIZ_LABEL_KEYS = {
      all: 'orders.chipAll',
      lab: 'index.serviceLab',
      inspection: 'index.serviceInspection',
      audit: 'index.serviceAudit',
      cert: 'index.serviceCert'
    };
    const BIZ_CAT_MAP = {
      lab: ['lab'],
      inspection: ['psi', 'dupro', 'fri'],
      audit: ['csr'],
      cert: []
    };

    function t(key){ return (window.I18n && I18n.t) ? I18n.t(key) : key; }
    function escapeHtml(str){
      return window.I18n ? I18n.escapeHtml(str) : String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function bizLabel(id){
      const key = BIZ_LABEL_KEYS[id] || BIZ_LABEL_KEYS.all;
      return t(key);
    }

    function matchesBiz(r){
      if(currentBiz === 'all') return true;
      const cats = BIZ_CAT_MAP[currentBiz];
      if(!cats) return false;
      return cats.indexOf(r.cat) >= 0;
    }

    function showReportsToast(message){
      const el = document.getElementById('reportsToast');
      if(!el || !message) return;
      el.textContent = message;
      el.classList.add('show');
      setTimeout(function(){ el.classList.remove('show'); }, 2200);
    }

    function openBizSheet(){
      const mask = document.getElementById('bizMask');
      const chip = document.getElementById('bizChip');
      if(!mask) return;
      mask.classList.add('show');
      mask.setAttribute('aria-hidden', 'false');
      if(chip){
        chip.classList.add('open');
        chip.setAttribute('aria-expanded', 'true');
      }
      const ds = document.getElementById('demoShortcuts');
      if(ds) ds.style.visibility = 'hidden';
    }

    function closeBizSheet(event){
      if(event && event.target && event.currentTarget && event.target !== event.currentTarget) return;
      const mask = document.getElementById('bizMask');
      const chip = document.getElementById('bizChip');
      if(mask){
        mask.classList.remove('show');
        mask.setAttribute('aria-hidden', 'true');
      }
      if(chip){
        chip.classList.remove('open');
        chip.setAttribute('aria-expanded', 'false');
      }
      const ds = document.getElementById('demoShortcuts');
      if(ds) ds.style.visibility = '';
    }

    function syncBizSelection(){
      document.querySelectorAll('.biz-opt').forEach(function(opt){
        const on = opt.getAttribute('data-biz') === currentBiz;
        opt.classList.toggle('selected', on);
        opt.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const label = document.getElementById('bizChipLabel');
      if(label){
        const key = BIZ_LABEL_KEYS[currentBiz] || BIZ_LABEL_KEYS.lab;
        label.setAttribute('data-i18n', key);
        label.textContent = bizLabel(currentBiz);
      }
    }

    function selectBizLine(id){
      const tap = document.querySelector('.biz-opt[data-biz="' + id + '"]');
      if(tap && tap.classList.contains('is-disabled')){
        showReportsToast(t('orders.bizInDevToast'));
        return;
      }
      currentBiz = BIZ_LABEL_KEYS[id] ? id : 'all';
      syncBizSelection();
      renderReports();
      closeBizSheet();
    }

    // Expose for inline onclick handlers
    window.openBizSheet = openBizSheet;
    window.closeBizSheet = closeBizSheet;
    window.selectBizLine = selectBizLine;

    function reportSearchHaystack(r){
      return [
        t(r.nameKey),
        r.sku,
        r.reportId,
        r.tag,
        t(r.supplierKey),
        t('reports.status.' + r.status),
        r.date
      ].join(' ').toLowerCase();
    }

    function filteredReports(){
      const q = String(searchQuery || '').trim().toLowerCase();
      return REPORTS.filter(function(r){
        if(!matchesBiz(r)) return false;
        if(!q) return true;
        return reportSearchHaystack(r).indexOf(q) >= 0;
      });
    }

    function reportsEmptyHtml(){
      var titleKey = 'reports.emptyHint';
      var subKey = 'reports.emptyHintSub';
      if(String(searchQuery || '').trim()){
        titleKey = 'reports.emptySearchHint';
        subKey = 'reports.emptySearchSub';
      } else if(currentBiz && currentBiz !== 'all' && currentBiz !== 'lab'){
        titleKey = 'reports.emptyBizTitle';
        subKey = 'reports.emptyBizSub';
      }
      return '<div class="list-empty" role="status">'+
        '<img class="list-empty-art" src="assets/empty-state.svg?v=20260805f" width="160" height="160" alt="" />'+
        '<div class="list-empty-title">'+escapeHtml(t(titleKey))+'</div>'+
        '<div class="list-empty-sub">'+escapeHtml(t(subKey))+'</div>'+
      '</div>';
    }

    function renderReportList(){
      const listEl = document.getElementById('reportList');
      if(!listEl) return;
      const list = filteredReports();
      if(!list.length){
        listEl.innerHTML = reportsEmptyHtml();
        return;
      }
      listEl.innerHTML = list.map(function(r){
        return '<a class="rlist-card '+statusAccent(r.status)+'" href="report-preview.html?sku='+encodeURIComponent(r.sku)+'">'+
          '<div class="rlist-top">'+
            '<div class="rlist-title">'+
              '<div class="rlist-name">'+escapeHtml(t(r.nameKey))+'</div>'+
              '<div class="rlist-sku">'+escapeHtml(r.sku)+'</div>'+
            '</div>'+
            '<div class="rlist-status">'+escapeHtml(t('reports.status.'+r.status))+'</div>'+
          '</div>'+
          '<div class="rlist-meta">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H8a2 2 0 0 0-2 2v12"/><path d="M18 8H10a2 2 0 0 0-2 2v10h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Z"/><path d="M12 12h4M12 15h4"/></svg>'+
            '<span class="report-no">'+escapeHtml(r.reportId)+'</span>'+
            '<span class="dot"></span>'+
            '<span class="rlist-date">'+escapeHtml(r.date)+'</span>'+
          '</div>'+
          '<div class="rlist-supplier-row">'+
            '<span class="rlist-supplier" title="'+escapeHtml(t(r.supplierKey))+'">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 21V10l6 3.5V10l6 3.5V6l4 2v13"/><path d="M7 21v-3.5h3V21"/></svg>'+
              '<span>'+escapeHtml(t(r.supplierKey))+'</span>'+
            '</span>'+
          '</div>'+
          '<div class="rlist-bottom">'+
            '<span class="rlist-preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>'+escapeHtml(t('reportPreview.title'))+'</span>'+
            '<span class="rlist-chev"><svg viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
          '</div>'+
        '</a>';
      }).join('');
    }

    // 旧文件夹渲染：先保留，USE_FOLDER_VIEW=true 时可恢复
    function renderFolderGrid(){
      const grid = document.getElementById('reportGrid');
      if(!grid) return;
      const list = filteredReports();
      if(!list.length){
        grid.innerHTML = '<div style="grid-column:1/-1;">'+reportsEmptyHtml()+'</div>';
        return;
      }
      grid.innerHTML = list.map(r =>
        '<a class="rcard '+r.color+'" href="report-preview.html?sku='+encodeURIComponent(r.sku)+'">'+
          '<span class="folder-back"></span>'+
          '<span class="papers"><i></i><i></i><i></i></span>'+
          '<div class="pocket">'+
            '<span class="tag">'+r.tag+'</span>'+
            '<div class="rname">'+t(r.nameKey)+'</div>'+
            '<div class="rsku">'+r.sku+'</div>'+
            '<div class="rstatus '+r.status+'"><span class="dot">'+ICONS[r.status]+'</span>'+t('reports.status.'+r.status)+'</div>'+
          '</div>'+
        '</a>'
      ).join('');
    }

    function renderReports(){
      if(USE_FOLDER_VIEW){
        document.getElementById('reportList').style.display = 'none';
        const grid = document.getElementById('reportGrid');
        grid.hidden = false;
        grid.classList.remove('folder-grid-legacy');
        renderFolderGrid();
      } else {
        document.getElementById('reportList').style.display = '';
        const grid = document.getElementById('reportGrid');
        grid.hidden = true;
        grid.classList.add('folder-grid-legacy');
        renderReportList();
      }
    }

    document.getElementById('bizChip').addEventListener('click', openBizSheet);

    const searchInput = document.getElementById('reportSearch');
    if(searchInput){
      searchInput.addEventListener('input', function(){
        searchQuery = searchInput.value || '';
        renderReports();
      });
    }

    syncBizSelection();
    renderReports();

    if (window.I18n) {
      I18n.initLangToggle({ onLangApplied: function(){
        const btn = document.getElementById('reportFilterBtn');
        if(btn){
          const label = I18n.t('common.filter');
          btn.setAttribute('aria-label', label);
          btn.setAttribute('title', label);
        }
        syncBizSelection();
        renderReports();
      }});
    }
  </script>
</body>
</html>
