<head>
<meta charset="UTF-8" />

<meta http-equiv="Pragma" content="no-cache" />

<title>QIMA 小程序 - 报告预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --carbon: #191919;
    --seal: #737373;
    --pool-500: #4169e1;
    --pool-050: #f2f5fd;
    --border: #dedede;
    --kiwi: #1f9d6b;
    --cherry: #e5353d;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Inter, sans-serif;
    background: #c9ced8;
    color: var(--carbon);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; }

  .phone {
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #f2f5fc 0%, #fafbfe 100%);
    overflow: hidden;
  }
  .blob { position: absolute; border-radius: 68px; filter: blur(50px); pointer-events: none; z-index: 0; }
  .blob-1 { width: 340px; height: 314px; background: #f58f00; opacity: .07; left: 230px; top: -130px; transform: rotate(30deg); }
  .blob-3 { width: 129px; height: 119px; background: #a086c4; opacity: .12; left: -70px; top: 0; transform: rotate(-30deg); }

  .statusbar {
    position: relative; z-index: 2;
    height: 47px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 27px 0 0;
  }
  .statusbar .time { width: 134px; text-align: center; font-weight: 600; font-size: 17px; letter-spacing: -.4px; padding-top: 4px; }
  .statusbar .indicators { display: flex; align-items: center; gap: 7px; padding-top: 4px; }
  .statusbar .indicators img { display: block; }

  .navbar {
    position: relative; z-index: 2;
    height: 44px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 17px;
  }
  .navbar .back { width: 12px; height: 20px; display: block; }
  .navbar .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 600; letter-spacing: -.34px; color: var(--carbon);
    max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-capsule {
    width: 83px; height: 30px; border-radius: 15px;
    background: rgba(255,255,255,.7); border: .5px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
  }
  .nav-capsule img { width: 17px; height: 17px; }
  .nav-capsule .divider { width: 1px; height: 18px; background: #d2d2d2; }

  .meta-bar {
    position: relative; z-index: 2;
    padding: 4px 16px 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .meta-top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .meta-left { min-width: 0; flex: 1; }
  .meta-id {
    font-size: 14px; font-weight: 700; color: var(--carbon);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta-sub {
    margin-top: 2px; font-size: 11px; color: var(--seal);
  }
  .status-pill {
    flex-shrink: 0; height: 24px; padding: 0 10px; border-radius: 6px;
    background: #eaf6f2; color: var(--kiwi); border: 1px solid #c9ecdc;
    font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px;
  }

  .meta-decision {
    display: flex; align-items: center; gap: 8px;
  }
  .meta-decision[hidden],
  .meta-decision-result[hidden] { display: none; }
  .dec-btn {
    flex: 1; height: 32px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: #fff;
  }
  .dec-btn.approve {
    color: var(--kiwi);
    border: 1.5px solid #9ed9c0;
    background: #f3fbf7;
  }
  .dec-btn.approve:active { background: #e4f6ee; }
  .dec-btn.reject {
    color: var(--cherry);
    border: 1.5px solid #f3b6b9;
    background: #fdf4f4;
  }
  .dec-btn.reject:active { background: #fceaea; }
  .dec-btn:disabled {
    opacity: .4; cursor: not-allowed;
    filter: grayscale(.35);
  }

  .meta-decision-result {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    background: #f3fbf7; border: 1px solid #c9ecdc;
  }
  .meta-decision-result.is-rejected {
    background: #fdf4f4; border-color: #f3b6b9;
  }
  .decision-text {
    min-width: 0; flex: 1;
    font-size: 12px; line-height: 16px; font-weight: 600;
    color: var(--kiwi);
  }
  .meta-decision-result.is-rejected .decision-text { color: var(--cherry); }
  .decision-undo {
    flex-shrink: 0; height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid #d9dee8; background: #fff;
    color: var(--seal); font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .decision-undo:active { background: #f5f6f8; }

  .decision-mask {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(25,25,25,.42);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .2s ease;
  }
  .decision-mask.show { opacity: 1; visibility: visible; }
  .decision-sheet {
    width: 100%; background: #fff;
    border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateY(18px); transition: transform .22s ease;
  }
  .decision-mask.show .decision-sheet { transform: translateY(0); }
  .decision-sheet-title {
    font-size: 16px; font-weight: 700; color: var(--carbon);
  }
  .decision-sheet-tip {
    margin-top: 8px; font-size: 12.5px; line-height: 18px; color: var(--seal);
  }
  .decision-toggle {
    margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px; border-radius: 10px; background: #f6f7fa;
  }
  .decision-toggle span { font-size: 13px; font-weight: 500; color: var(--carbon); }
  .switch {
    position: relative; width: 42px; height: 24px; flex-shrink: 0;
    border-radius: 12px; background: #d5d9e2; border: none; cursor: pointer;
    transition: background .18s ease;
  }
  .switch.on { background: var(--kiwi); }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
    transition: transform .18s ease;
  }
  .switch.on::after { transform: translateX(18px); }
  .decision-comment {
    margin-top: 12px;
  }
  .decision-comment[hidden] { display: none; }
  .decision-comment label {
    display: block; font-size: 12px; color: var(--seal); margin-bottom: 6px;
  }
  .decision-comment textarea {
    width: 100%; min-height: 72px; resize: none;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 13px; color: var(--carbon);
    outline: none; background: #fff;
  }
  .decision-comment textarea:focus { border-color: #9eb4f0; box-shadow: 0 0 0 3px rgba(65,105,225,.12); }
  .decision-sheet-actions {
    margin-top: 16px; display: flex; gap: 10px;
  }
  .decision-sheet-actions button {
    flex: 1; height: 42px; border-radius: 11px;
    font-size: 15px; font-weight: 600; cursor: pointer; border: none;
  }
  .decision-sheet-actions .ghost {
    background: #fff; color: var(--seal); border: 1px solid #d9dee8;
  }
  .decision-sheet-actions .solid {
    color: #fff;
  }
  .decision-sheet-actions .solid.approve { background: var(--kiwi); }
  .decision-sheet-actions .solid.reject { background: var(--cherry); }
  .decision-sheet-actions button:active { opacity: .9; }

  .preview-scroll {
    position: relative; z-index: 1;
    flex: 1; overflow-y: auto;
    padding: 0 13px 16px;
  }
  .preview-scroll::-webkit-scrollbar { display: none; }

  .pdf-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0 0 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(25,25,25,.06);
  }
  .pdf-card + .pdf-card { margin-top: 12px; }
  .pdf-page {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px 8px 0 0;
    background: #fff;
  }
  .page-hint {
    text-align: center;
    font-size: 11px;
    color: var(--seal);
    padding: 10px 12px 0;
  }

  .bottom-actions {
    position: relative; z-index: 3;
    flex-shrink: 0;
    background: #fff;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -1px 6px rgba(0,0,0,.06);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 10px;
  }
  .action-btn {
    flex: 1; height: 44px; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: none;
  }
  .action-btn.secondary {
    background: #fff; color: var(--pool-500);
    border: 1px solid #dce4fb;
  }
  .action-btn.primary {
    background: var(--pool-500); color: #fff;
    box-shadow: 0 6px 16px rgba(65,105,225,.28);
  }
  .action-btn:active { opacity: .9; }

  .toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: rgba(25,25,25,.86); color: #fff; font-size: 13px;
    padding: 10px 14px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease; z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>

<body>
  <div class="phone">
    <div class="blob blob-1"></div>
    <div class="blob blob-3"></div>

    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="indicators">
        <img src="assets/signal.svg" alt="" width="18" height="12" />
        <img src="assets/wifi.svg" alt="" width="17" height="12" />
        <img src="assets/battery.svg" alt="" width="27" height="13" />
      </div>
    </div>

    <div class="navbar">
      <a href="reports.html"><img class="back" src="assets/vector52.svg" alt="返回" data-i18n-alt="common.back" /></a>
      <div class="title" data-i18n="reportPreview.title">报告预览</div>
      <div class="nav-capsule">
        <img src="assets/share.svg" alt="" />
        <div class="divider"></div>
        <img src="assets/home.svg" alt="" />
      </div>
    </div>

    <div class="meta-bar">
      <div class="meta-top">
        <div class="meta-left">
          <div class="meta-id" id="reportId">T-24106085-11-R1</div>
          <div class="meta-sub" id="reportMeta">LAB · SKU-65120</div>
        </div>
        <div class="status-pill" id="reportStatus">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="reports.status.pass">PASS</span>
        </div>
      </div>
      <div class="meta-decision" id="decisionActions">
        <button class="dec-btn approve" type="button" id="approveBtn" onclick="openDecision('approve')">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="reportPreview.approve">Approve</span>
        </button>
        <button class="dec-btn reject" type="button" id="rejectBtn" onclick="openDecision('reject')">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span data-i18n="reportPreview.reject">Reject</span>
        </button>
      </div>
      <div class="meta-decision-result" id="decisionResult" hidden>
        <div class="decision-text" id="decisionText"></div>
        <button class="decision-undo" type="button" id="undoBtn" onclick="undoDecision()" data-i18n="reportPreview.undo">Undo</button>
      </div>
    </div>

    <div class="preview-scroll">
      <div class="pdf-card">
        <img class="pdf-page" src="assets/report-pdf-preview.png" alt="Test report page 1" />
        <div class="page-hint" data-i18n="reportPreview.pageHint1">第 1 页 · 共 12 页</div>
      </div>
      <div class="pdf-card">
        <img class="pdf-page" src="assets/report-pdf-preview-page2.png" alt="Test report page 2" />
        <div class="page-hint" data-i18n="reportPreview.pageHint2">第 2 页 · 共 12 页</div>
      </div>
    </div>

    <div class="bottom-actions">
      <button class="action-btn secondary" type="button" onclick="shareReport()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span data-i18n="reportPreview.share">分享</span>
      </button>
      <button class="action-btn primary" type="button" onclick="downloadReport()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        <span data-i18n="reportPreview.download">下载报告</span>
      </button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="decision-mask" id="decisionMask" onclick="closeDecisionMask(event)">
      <div class="decision-sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
        <div class="decision-sheet-title" id="decisionSheetTitle">Approve report</div>
        <div class="decision-sheet-tip" id="decisionSheetTip"></div>
        <div class="decision-toggle">
          <span data-i18n="reportPreview.informSupplier">Inform the supplier</span>
          <button class="switch" type="button" id="informSwitch" aria-pressed="false" onclick="toggleInform()"></button>
        </div>
        <div class="decision-comment" id="decisionComment" hidden>
          <label for="supplierComment" data-i18n="reportPreview.commentsSupplier">Comments to supplier</label>
          <textarea id="supplierComment" data-i18n-placeholder="reportPreview.commentsPlaceholder" placeholder="Optional: reason for your decision"></textarea>
        </div>
        <div class="decision-sheet-actions">
          <button class="ghost" type="button" onclick="closeDecision()" data-i18n="reportPreview.cancel">Cancel</button>
          <button class="solid approve" type="button" id="confirmDecisionBtn" onclick="confirmDecision()" data-i18n="reportPreview.confirm">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const REPORT_META = {
      // Report numbers must match the list in reports.html — the list is the entry point.
      'SKU-65120': { id: 'T-24106085-11-R1', tag: 'LAB', sku: 'SKU-65120', status: 'pass', nameKey: 'reports.product.toys' },
      'SKU-89231': { id: 'T-24106084-11-R1', tag: 'PSI', sku: 'SKU-89231', status: 'pass', nameKey: 'reports.product.psi' },
      'SKU-77321': { id: 'T-24106086-11-R1', tag: 'DUPRO', sku: 'SKU-77321', status: 'fail', nameKey: 'reports.product.textile' },
      'SKU-51840': { id: 'T-24106087-11-R1', tag: 'FRI', sku: 'SKU-51840', status: 'pass', nameKey: 'reports.product.electronics' },
      'SKU-43902': { id: 'T-24106088-11-R1', tag: 'LAB', sku: 'SKU-43902', status: 'pending', nameKey: 'reports.product.hardline' },
      'SKU-38771': { id: 'T-24106089-11-R1', tag: 'CSR', sku: 'SKU-38771', status: 'pass', nameKey: 'reports.product.food' }
    };

    const DECISION_STORAGE_KEY = 'qima-report-decision-v1';
    let pendingDecision = null;

    function t(key) {
      return (window.I18n && I18n.t) ? I18n.t(key) : key;
    }

    function getSku() {
      return new URLSearchParams(window.location.search).get('sku') || 'SKU-65120';
    }

    function currentMeta() {
      return REPORT_META[getSku()] || REPORT_META['SKU-65120'];
    }

    function canDecide(meta) {
      // myQIMA: approve/reject only when the report result is final (not pending).
      return meta.status === 'pass' || meta.status === 'fail';
    }

    function loadDecisions() {
      try {
        return JSON.parse(localStorage.getItem(DECISION_STORAGE_KEY) || '{}') || {};
      } catch (e) {
        return {};
      }
    }

    function saveDecision(sku, decision) {
      const all = loadDecisions();
      if (decision) all[sku] = decision;
      else delete all[sku];
      localStorage.setItem(DECISION_STORAGE_KEY, JSON.stringify(all));
    }

    function getDecision(sku) {
      return loadDecisions()[sku] || null;
    }

    function formatDecisionDate(iso) {
      const d = iso ? new Date(iso) : new Date();
      if (Number.isNaN(d.getTime())) return '—';
      const pad = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function applyMeta() {
      const meta = currentMeta();
      const idEl = document.getElementById('reportId');
      const metaEl = document.getElementById('reportMeta');
      const statusEl = document.getElementById('reportStatus');
      if (idEl) idEl.textContent = meta.id;
      if (metaEl) {
        metaEl.textContent = meta.tag + ' · ' + meta.sku + ' · ' + t(meta.nameKey);
      }
      if (statusEl) {
        const label = t('reports.status.' + meta.status);
        statusEl.className = 'status-pill' + (meta.status === 'fail' ? ' fail' : meta.status === 'pending' ? ' pending' : '');
        statusEl.innerHTML =
          (meta.status === 'fail'
            ? '<svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'
            : meta.status === 'pending'
              ? '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.7"/><path d="M8 4.6V8l2.4 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
              : '<svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>') +
          '<span>' + label + '</span>';
        if (meta.status === 'fail') {
          statusEl.style.background = '#fdecee';
          statusEl.style.color = '#e4002b';
          statusEl.style.borderColor = '#f5c2cb';
        } else if (meta.status === 'pending') {
          statusEl.style.background = '#fff8e8';
          statusEl.style.color = '#b8860b';
          statusEl.style.borderColor = '#f0e0a8';
        } else {
          statusEl.style.background = '';
          statusEl.style.color = '';
          statusEl.style.borderColor = '';
        }
      }
      renderDecision();
    }

    function renderDecision() {
      const meta = currentMeta();
      const decision = getDecision(meta.sku);
      const actions = document.getElementById('decisionActions');
      const result = document.getElementById('decisionResult');
      const text = document.getElementById('decisionText');
      const approveBtn = document.getElementById('approveBtn');
      const rejectBtn = document.getElementById('rejectBtn');
      const allowed = canDecide(meta);

      if (decision) {
        actions.hidden = true;
        result.hidden = false;
        result.classList.toggle('is-rejected', decision.state === 'rejected');
        const stateLabel = t(decision.state === 'approved' ? 'reportPreview.approved' : 'reportPreview.rejected');
        text.textContent = t('reportPreview.decisionBy')
          .replace('{{state}}', stateLabel)
          .replace('{{name}}', decision.approver || t('reportPreview.approverName'))
          .replace('{{date}}', formatDecisionDate(decision.at));
        return;
      }

      result.hidden = true;
      actions.hidden = false;
      approveBtn.disabled = !allowed;
      rejectBtn.disabled = !allowed;
      approveBtn.title = allowed ? '' : t('reportPreview.decisionUnavailable');
      rejectBtn.title = allowed ? '' : t('reportPreview.decisionUnavailable');
    }

    function openDecision(state) {
      const meta = currentMeta();
      if (!canDecide(meta)) {
        showToast('reportPreview.decisionUnavailable');
        return;
      }
      pendingDecision = state;
      const mask = document.getElementById('decisionMask');
      const title = document.getElementById('decisionSheetTitle');
      const tip = document.getElementById('decisionSheetTip');
      const confirmBtn = document.getElementById('confirmDecisionBtn');
      const inform = document.getElementById('informSwitch');
      const commentWrap = document.getElementById('decisionComment');
      const comment = document.getElementById('supplierComment');

      title.textContent = t(state === 'approve' ? 'reportPreview.approveReport' : 'reportPreview.rejectReport');
      tip.textContent = t(state === 'approve' ? 'reportPreview.decisionTipApprove' : 'reportPreview.decisionTipReject');
      confirmBtn.className = 'solid ' + state;
      confirmBtn.textContent = t('reportPreview.confirm');
      inform.classList.remove('on');
      inform.setAttribute('aria-pressed', 'false');
      commentWrap.hidden = true;
      comment.value = '';
      mask.classList.add('show');
    }

    function closeDecision() {
      document.getElementById('decisionMask').classList.remove('show');
      pendingDecision = null;
    }

    function closeDecisionMask(event) {
      if (event.target === event.currentTarget) closeDecision();
    }

    function toggleInform() {
      const inform = document.getElementById('informSwitch');
      const on = !inform.classList.contains('on');
      inform.classList.toggle('on', on);
      inform.setAttribute('aria-pressed', on ? 'true' : 'false');
      document.getElementById('decisionComment').hidden = !on;
    }

    function confirmDecision() {
      if (!pendingDecision) return;
      const meta = currentMeta();
      const inform = document.getElementById('informSwitch').classList.contains('on');
      const comment = (document.getElementById('supplierComment').value || '').trim();
      saveDecision(meta.sku, {
        state: pendingDecision === 'approve' ? 'approved' : 'rejected',
        approver: t('reportPreview.approverName'),
        informSupplier: inform,
        comment: inform ? comment : '',
        at: new Date().toISOString()
      });
      closeDecision();
      renderDecision();
      showToast('reportPreview.decisionSaved');
    }

    function undoDecision() {
      if (!window.confirm(t('reportPreview.undoConfirm'))) return;
      saveDecision(currentMeta().sku, null);
      renderDecision();
      showToast('reportPreview.decisionUndone');
    }

    function showToast(key) {
      const toast = document.getElementById('toast');
      toast.textContent = t(key);
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { toast.classList.remove('show'); }, 1600);
    }

    function downloadReport() {
      const link = document.createElement('a');
      link.href = 'assets/report-pdf-preview.png';
      link.download = (document.getElementById('reportId').textContent || 'report') + '.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('reportPreview.downloaded');
    }

    function shareReport() {
      showToast('reportPreview.share');
    }

    applyMeta();
    if (window.I18n) {
      I18n.initLangToggle({ onLangApplied: applyMeta });
    }
  </script>
</body>
</html>
