<head>

<title>QIMA 小程序 - 订单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --carbon: #191919;
    --seal: #737373;
    --pool-500: #4169e1;
    --pool-100: #e6ecfb;
    --pool-050: #f2f5fd;
    --qima-red: #e4002b;
    --border: #dedede;
    --kiwi: #1f9d6b;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Inter, sans-serif;
    background: #c9ced8;
    color: var(--carbon);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; }

  /* ===== 手机外壳（固定高度，列表内部滚动）===== */
  .phone {
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #f2f5fc 0%, #fafbfe 100%);
    overflow: hidden;
  }
  .blob { position: absolute; border-radius: 68px; filter: blur(50px); pointer-events: none; z-index: 0; }
  .blob-1 { width: 340px; height: 314px; background: #f58f00; opacity: .07; left: 230px; top: -130px; transform: rotate(30deg); }
  .blob-3 { width: 129px; height: 119px; background: #a086c4; opacity: .12; left: -70px; top: 0; transform: rotate(-30deg); }
  .blob-4 { width: 129px; height: 119px; background: #ff9a7f; opacity: .12; left: -120px; top: 0; transform: rotate(-30deg); }

  /* ===== 状态栏 ===== */
  .statusbar {
    position: relative; z-index: 2;
    height: 47px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 27px 0 0;
  }
  .statusbar .time { width: 134px; text-align: center; font-weight: 600; font-size: 17px; letter-spacing: -.4px; padding-top: 4px; }
  .statusbar .indicators { display: flex; align-items: center; gap: 7px; padding-top: 4px; }
  .statusbar .indicators img { display: block; }

  /* ===== 导航栏（标题居中）===== */
  .navbar {
    position: relative; z-index: 2;
    height: 44px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 17px;
  }
  .navbar .back { width: 12px; height: 20px; }
  .navbar .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 600; letter-spacing: -.34px; color: var(--carbon);
  }
  .nav-capsule {
    width: 83px; height: 30px; border-radius: 15px;
    background: rgba(255,255,255,.7); border: .5px solid var(--border);
    display: flex; align-items: center; justify-content: space-around; position: relative;
  }
  .nav-capsule img { width: 17px; height: 17px; }
  .nav-capsule .divider { width: 1px; height: 18px; background: #d2d2d2; }

  /* ===== 筛选区 ===== */
  .filterbar { position: relative; z-index: 2; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .filter-row1 { display: flex; align-items: center; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    height: 36px; padding: 0 10px; border-radius: 8px;
    background: #fff; border: 1px solid #e6e9f2;
    font-size: 12px; color: var(--carbon); white-space: nowrap;
  }
  .chip .caret { color: var(--seal); }
  .search {
    flex: 1; min-width: 0; height: 36px; border-radius: 8px;
    background: #fff; border: 1px solid #e6e9f2;
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
  }
  .search svg { color: #9aa0ad; flex-shrink: 0; }
  .search input {
    border: none; outline: none; background: transparent; width: 100%;
    font-size: 13px; color: var(--carbon);
  }
  .search input::placeholder { color: #aab0bc; }
  .filter-btn {
    flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 8px;
    background: var(--pool-050); color: var(--pool-500);
    display: flex; align-items: center; gap: 4px; font-size: 13px;
    border: 1px solid #dce4fb;
  }

  /* ===== 列表滚动区 ===== */
  .list {
    position: relative; z-index: 1; flex: 1; overflow-y: auto;
    padding: 4px 16px 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .list::-webkit-scrollbar { display: none; }

  /* ===== 订单卡片 ===== */
  /* Product first, status second, reference numbers last — the card is one
     tap target, so no inner boxes and no separate "view all" link. */
  .ocard {
    display: flex; align-items: flex-start; gap: 12px;
    background: #fff; border-radius: 14px;
    box-shadow: 0 1px 2px rgba(25,25,25,.05), 0 8px 20px rgba(25,25,25,.05);
    padding: 13px 14px;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: background .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  .ocard:active {
    background: #fbfcff;
    transform: scale(.993);
    box-shadow: 0 1px 2px rgba(25,25,25,.05), 0 4px 10px rgba(25,25,25,.05);
  }

  /* Centred so the tile stays balanced whether the meta row wraps or not. */
  .ocard-thumb {
    position: relative; width: 54px; height: 54px;
    border-radius: 10px; overflow: hidden; flex-shrink: 0;
    align-self: center;
  }
  .ocard-thumb.fabric-black { background: linear-gradient(135deg, #34343a 0%, #0e0e12 100%); }
  .ocard-thumb.fabric-denim { background: linear-gradient(135deg, #2c3656 0%, #10162a 100%); }
  .ocard-thumb.fabric-grey { background: linear-gradient(135deg, #5a5f6b 0%, #2c303a 100%); }
  .ocard-thumb.fabric-black::after,
  .ocard-thumb.fabric-denim::after,
  .ocard-thumb.fabric-grey::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px);
  }
  .ocard-thumb.icon {
    background: #f2f5fc; display: grid; place-items: center;
  }
  .ocard-thumb.icon img { width: 22px; height: 22px; opacity: .8; }

  .ocard-main { flex: 1; min-width: 0; }
  .ocard-title { display: flex; align-items: flex-start; gap: 8px; }
  .pname {
    flex: 1; min-width: 0;
    font-size: 15px; font-weight: 600; color: var(--carbon); line-height: 21px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .status {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 5px;
    height: 22px; padding: 0 9px; border-radius: 999px;
    font-size: 11.5px; line-height: 1; white-space: nowrap; box-sizing: border-box;
  }
  .status::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .status.blue { background: #eef3ff; color: var(--pool-500); }
  .status.green { background: #e9f6f0; color: var(--kiwi); }
  .status.orange { background: #fef0ee; color: #ff5f4e; }
  /* Beats the global English wrap rule: the card pill must stay one line so the
     product name keeps the width it needs. */
  html[lang="en"] .ocard .status {
    max-width: none; min-height: 0; height: 22px;
    padding: 0 9px; line-height: 1; white-space: nowrap;
  }

  .ocard-sub {
    display: flex; align-items: center; gap: 6px; margin-top: 4px;
    font-size: 12px; color: var(--seal); line-height: 17px;
  }
  .ocard-sub .stext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-tag {
    flex-shrink: 0; padding: 0 6px; border-radius: 4px;
    font-size: 11px; line-height: 16px;
    background: #e9f6f0; color: var(--kiwi);
  }

  /* Wraps rather than truncates: an order number is a reference users quote back,
     so it always renders in full and the date drops to a second line if needed. */
  .ocard-meta {
    display: flex; flex-wrap: wrap; align-items: center;
    column-gap: 10px; row-gap: 2px; margin-top: 7px;
    font-size: 11px; line-height: 15px;
  }
  .meta-item { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .meta-item .mk { color: #a7aebb; flex-shrink: 0; }
  .meta-item .mv {
    color: #6d7482; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .ocard .chev {
    width: 16px; height: 16px; flex-shrink: 0;
    align-self: center; opacity: .35;
  }

</style>

  <script>
    function escapeHtml(str){
      return window.I18n ? I18n.escapeHtml(str) : String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function mapStatusLabel(status){
      var map = {
        pending_verification: 'status.short.pendingVerification',
        in_progress: 'status.short.inProgress',
        report_completed: 'status.short.reportCompleted',
        sample_review: 'status.short.sampleReview',
        waiting_for_sample_review: 'status.short.sampleReview',
        cancelled: 'status.short.pendingConfirmation'
      };
      var key = map[status];
      return key && typeof t === 'function' ? t(key) : (status || '');
    }

    function statusTone(status){
      if(status === 'report_completed') return 'green';
      return 'blue';
    }

    function formatDate(value){
      if(!value) return '';
      return String(value).slice(0, 10);
    }

    function liveOrderCard(row){
      var ref = row.order_ref || row.application_no || '';
      var appNo = row.application_no || ref;
      var status = row.status || 'pending_verification';
      var product = row.product_name || row.category || row.project_name || '';
      if(!product && typeof t === 'function') product = t('orderChat.productUnrecognized') || '—';
      if(!product) product = '—';
      var ordered = formatDate(row.ordered_at || row.created_at);
      var sub = row.service_type || row.project_name || row.program || '';
      if(sub && product && String(sub).toLowerCase() === String(product).toLowerCase()) sub = '';
      var label = function(key, fallback){ return typeof t === 'function' ? t(key) : fallback; };
      var subHtml = sub
        ? '<div class="ocard-sub"><span class="stext">' + escapeHtml(sub) + '</span></div>'
        : '';
      var dateHtml = ordered
        ? '<span class="meta-item"><span class="mk">' + label('orders.metaOrdered', '下单') + '</span>'+
          '<span class="mv">' + escapeHtml(ordered) + '</span></span>'
        : '';
      return '<a class="ocard live" href="order-detail.html?order=' + encodeURIComponent(ref) + '">'+
        '<div class="ocard-thumb icon"><img src="assets/order_icon.svg" alt="" /></div>'+
        '<div class="ocard-main">'+
          '<div class="ocard-title">'+
            '<div class="pname">' + escapeHtml(product) + '</div>'+
            '<div class="status ' + statusTone(status) + '">' + escapeHtml(mapStatusLabel(status)) + '</div>'+
          '</div>'+
          subHtml +
          '<div class="ocard-meta">'+
            '<span class="meta-item"><span class="mk">' + label('orders.metaNo', '单号') + '</span>'+
              '<span class="mv">' + escapeHtml(appNo) + '</span></span>'+
            dateHtml +
          '</div>'+
        '</div>'+
        '<img class="chev" src="assets/chevron_row.svg" alt="" />'+
      '</a>';
    }

    function loadLiveOrders(){
      var api = window.QimaSupabase;
      var list = document.getElementById('orderList');
      if(!api || !api.ready() || !list) return;
      api.getFullOrders().then(function(rows){
        if(!rows || !rows.length) return;
        var html = rows.slice(0, 20).map(liveOrderCard).join('');
        list.insertAdjacentHTML('afterbegin', html);
      }).catch(function(err){
        console.warn('load live orders failed', err);
      });
    }

    if (window.I18n) I18n.initLangToggle();
    loadLiveOrders();
  </script>
</body>
